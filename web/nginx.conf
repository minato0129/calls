# 本番用 web コンテナ: React のビルド結果を配信するだけ。
# /api や /auth の振り分けは入口の nginx コンテナ(nginx/)が行う。
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Service Worker とエントリは常に最新を取りに行く(PWA の更新が止まらないように)
    location = /sw.js                { add_header Cache-Control "no-cache"; try_files $uri =404; }
    location = /manifest.webmanifest { add_header Cache-Control "no-cache"; try_files $uri =404; }
    location = /index.html           { add_header Cache-Control "no-cache"; }

    # ハッシュ付きのビルド成果物は長くキャッシュしてよい
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # React Router のパス(/rooms/xxx など)は index.html を返す
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
