# コンテナ構成
#   nginx(入口 :8080) ─┬─ /api, /auth → server(Go / Echo + GORM)→ mysql
#                       └─ それ以外    → web(React)
#
# docker compose up -d --build
#   → docker-compose.override.yml も自動で読み込まれ、開発構成(ホットリロード)で起動
# docker compose -f docker-compose.yml up -d --build
#   → 本番構成(Go はバイナリ、React はビルド済みファイルを配信)
# docker compose --profile tunnel up -d
#   → Cloudflare の名前付きトンネルで固定の URL から公開(.env の CLOUDFLARE_TUNNEL_TOKEN が必要)
# docker compose --profile quicktunnel up -d
#   → アカウント不要の一時的な URL を発行(起動のたびに URL が変わる。docker compose logs quicktunnel に表示)

services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    environment:
      API_UPSTREAM: server:8080
      WEB_UPSTREAM: web:80
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
    depends_on:
      - server
      - web
    restart: unless-stopped

  web:
    build:
      context: ./web
      target: prod
    restart: unless-stopped

  server:
    build:
      context: ./server
      target: prod
    environment:
      DATABASE_DSN: callsys:${MYSQL_PASSWORD:-callsys}@tcp(mysql:3306)/callsys
      BASE_URL: ${BASE_URL:-http://localhost:8080}
      SESSION_SECRET: ${SESSION_SECRET:-dev-secret-change-me}
      AUTH_MODE: ${AUTH_MODE:-microsoft}
      AZURE_TENANT_ID: ${AZURE_TENANT_ID:-}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID:-}
      AZURE_CLIENT_SECRET: ${AZURE_CLIENT_SECRET:-}
      ALLOWED_EMAIL_DOMAINS: ${ALLOWED_EMAIL_DOMAINS:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-admin@example.com}
      FORCE_OPEN: ${FORCE_OPEN:-false}
      RENOTIFY_SECONDS: ${RENOTIFY_SECONDS:-180}
      PERIODS: ${PERIODS:-}
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: callsys
      MYSQL_USER: callsys
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-callsys}
      TZ: UTC
    ports:
      - "3306:3306" # 手元のツールから DB を見る用。不要なら消してよい
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  # 固定の URL で公開する(Cloudflare の名前付きトンネル)
  # Cloudflare のダッシュボードで、公開ホスト名のサービスを http://nginx:80 にしておく
  tunnel:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-} # .env に設定(空だと起動時にエラーになる)
    depends_on:
      - nginx
    restart: unless-stopped
    profiles: ["tunnel"]

  # アカウント不要の一時的な URL(起動のたびに変わる)
  quicktunnel:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate --url http://nginx:80
    depends_on:
      - nginx
    profiles: ["quicktunnel"]

volumes:
  mysql-data:
